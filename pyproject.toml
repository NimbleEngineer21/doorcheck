[project]
name = "doorcheck"
version = "0.1.0a1"
description = "See what a Home Assistant integration can do before you let it in."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nimbleengineer21" }]
requires-python = ">=3.13.2"
# The same range Home Assistant requires, so installing doorcheck there changes nothing.
dependencies = ["packaging>=23.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.scripts]
doorcheck = "doorcheck.cli:entrypoint"

[project.entry-points."doorcheck.adapters"]
guarddog = "doorcheck.adapters.guarddog:GuardDog"
guarddog-dependencies = "doorcheck.adapters.guarddog:GuardDogDependencies"
osv-scanner = "doorcheck.adapters.osv:OsvScanner"
semgrep = "doorcheck.adapters.semgrep:Semgrep"
zizmor = "doorcheck.adapters.zizmor:Zizmor"

[project.urls]
Source = "https://github.com/nimbleengineer21/doorcheck"
Security = "https://github.com/nimbleengineer21/doorcheck/security/policy"

[dependency-groups]
dev = [
    "commitizen==4.19.3",
    "complexipy==8.3.0",
    "cryptography==50.0.1",
    "import-linter==2.15",
    "jsonschema==4.26.0",
    "mutmut==3.8.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "resvg-py==0.5.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
# Wait at least three days before resolving new releases; bots add their own
# cooldowns. These delays aid review but do not establish trust.
exclude-newer = "3 days"

[tool.uv.build-backend]
# Only the package ships. Tests, fixtures and tooling never reach PyPI.
source-exclude = ["tests", "tools", ".github", "ha", "custom_components"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Deliberately unsafe code that scanning tools are recorded against.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security checks
    "SIM",          # simplifications
    "RUF",
    "ERA",          # commented-out code
    "PTH",          # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
# Asserts are how pytest checks results.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src/doorcheck", "tools"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.importlinter]
root_packages = ["doorcheck"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The engine never depends on Home Assistant"
type = "forbidden"
source_modules = ["doorcheck"]
forbidden_modules = ["homeassistant"]

[[tool.importlinter.contracts]]
name = "Each layer builds only on the layers below it"
type = "layers"
layers = [
    "doorcheck.cli",
    "doorcheck.cli_compare | doorcheck.cli_hosts | doorcheck.cli_scan",
    "doorcheck.cli_output | doorcheck.comparison | doorcheck.hosts | doorcheck.cli_report",
    "doorcheck.messages | doorcheck.sarif | doorcheck.fetch",
    "doorcheck.report",
    "doorcheck.rules",
    "doorcheck.capabilities | doorcheck.adapters",
    "doorcheck.dependencies",
    "doorcheck.pypi",
    "doorcheck.checks | doorcheck.requirements | doorcheck.https",
    "doorcheck.findings | doorcheck.errors | doorcheck.tree | doorcheck.text | doorcheck.presentation | doorcheck.revocation",
]

[[tool.importlinter.contracts]]
name = "Only the adapters run other programs"
type = "forbidden"
source_modules = [
    "doorcheck.capabilities",
    "doorcheck.cli_compare",
    "doorcheck.cli_hosts",
    "doorcheck.cli_report",
    "doorcheck.hosts",
    "doorcheck.comparison",
    "doorcheck.checks",
    "doorcheck.dependencies",
    "doorcheck.errors",
    "doorcheck.fetch",
    "doorcheck.findings",
    "doorcheck.https",
    "doorcheck.messages",
    "doorcheck.presentation",
    "doorcheck.pypi",
    "doorcheck.report",
    "doorcheck.rules",
    "doorcheck.requirements",
    "doorcheck.revocation",
    "doorcheck.sarif",
    "doorcheck.text",
    "doorcheck.tree",
]
forbidden_modules = ["subprocess", "doorcheck.adapters"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"

[tool.mutmut]
source_paths = ["src/doorcheck/", "tools/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Data the tests read, copied into mutmut's working copy.
also_copy = [
    "benchmark/", "tools/templates/", "tools/visual-check.js", "docs/",
    ".github/workflows/",
    "custom_components/doorcheck/",
    # The release check reads these; a directory entry creates mutants/ha first.
    "hacs.json", "ha/acceptance/", "ha/pyproject.toml",
]
# Coverage of mutated copies is meaningless and would fail the threshold.
pytest_add_cli_args = ["--no-cov"]
