name: Something doesn't work
description: Doorcheck crashed, gave wrong output, or didn't do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doorcheck version
    validations:
      required: true
  - type: input
    id: home-assistant
    attributes:
      label: Home Assistant version, if it's about the integration
