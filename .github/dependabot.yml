version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    # Upgrade resolved versions without raising already-compatible runtime bounds.
    # Exact development pins are replaced with new exact versions.
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: all
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]
      python-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]
