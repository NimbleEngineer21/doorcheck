# Benchmark corpus. Code is fetched at these exact commits when the benchmark runs;
# nothing here is ever vendored into the repo or executed.
#
# kind = "vulnerable": a published bug; each [[case.expect]] must be found.
# kind = "fixed": the release that fixed it; nothing Serious or Review should fire.
# kind = "reference": code assumed benign. Serious or Review findings count as
#   false alarms until someone triages them; a confirmed bug moves to "vulnerable".
#
# Reference set: 7 popular integrations, then a random sample (Python random.Random,
# seed 20261024) of hacs/default at commit 26677ecf6ffe5d279972542b8966e40aee3998cd:
# 43 more integrations and 20 dashboard cards, each pinned to its HEAD on 2026-10-24.

[[case]]
id = "hacs-1.9.0"
repo = "hacs/integration"
commit = "275d6cc28070145931a68bb58a39feefec9f41d9"
kind = "vulnerable"
note = "Unauthenticated /hacsfiles view reads files from a URL path (2021 disclosure)."

[[case.expect]]
rule = "ha-unauth-view-unsanitized-path"
path = "custom_components/hacs/helpers/classes/frontend_view.py"
line = 24

[[case]]
id = "hacs-1.10.0"
repo = "hacs/integration"
commit = "6fbce52d7fc6c55ffdd62602cf226076bb4fb27b"
kind = "fixed"
note = "Adds sanitize_path."

